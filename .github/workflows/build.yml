name: Build and Upload to TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download IPA
        run: |
          curl -L -o app.ipa "${{ secrets.IPA_URL }}"

      - name: Install dependencies
        run: |
          pip3 install codemagic-cli-tools --break-system-packages

      - name: Setup API Key
        run: |
          mkdir -p ~/.private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Fetch signing files
        run: |
          keychain initialize
          app-store-connect create-certificate \
            --issuer-id "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --private-key "@file:$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" \
            --type IOS_DISTRIBUTION
          app-store-connect fetch-signing-files \
            "${{ secrets.BUNDLE_ID }}" \
            --issuer-id "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --private-key "@file:$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" \
            --type IOS_APP_STORE \
            --create

      - name: Change Bundle ID and Resign
        run: |
          unzip -o app.ipa -d Payload_dir
          APP_PATH=$(find Payload_dir -name "*.app" -maxdepth 3 | head -1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${{ secrets.BUNDLE_ID }}" "$APP_PATH/Info.plist"
          PROFILE=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" | head -1)
          cp "$PROFILE" "$APP_PATH/embedded.mobileprovision"
          CERT=$(security find-identity -v -p codesigning | grep "iPhone Distribution" | head -1 | awk '{print $2}')
          codesign --force --sign "$CERT" --entitlements /dev/null "$APP_PATH"
          cd Payload_dir
          zip -r ../app_new.ipa Payload/
          cd ..
          mv app_new.ipa app.ipa

      - name: Upload to TestFlight
        run: |
          app-store-connect publish \
            --issuer-id "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --private-key "@file:$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" \
            --path app.ipa \
            --testflight
