name: Build and Upload to TestFlight
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Download IPA
        run: curl -L -o app.ipa "${{ secrets.IPA_URL }}"
      - name: Install tools
        run: pip3 install codemagic-cli-tools --break-system-packages
      - name: Setup API Key
        run: |
          mkdir -p ~/.private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
      - name: Sign and Upload
        run: |
          keychain initialize
          openssl genrsa -out cert.key 2048
          app-store-connect certificates create --issuer-id "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" --private-key "@file:$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" --type IOS_DISTRIBUTION --certificate-key "@file:cert.key"
          P12=$(find ~/Library/Developer/Xcode -name "*.p12" | head -1)
          KEYCHAIN=$(ls ~/Library/codemagic-cli-tools/keychains/*.keychain-db | head -1)
          security import "$P12" -k "$KEYCHAIN" -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"
          app-store-connect fetch-signing-files "${{ secrets.BUNDLE_ID }}" --issuer-id "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" --private-key "@file:$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" --type IOS_APP_STORE --create
          unzip -o app.ipa -d Payload_dir
          APP_PATH=$(find Payload_dir -name "*.app" -maxdepth 3 | head -1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${{ secrets.BUNDLE_ID }}" "$APP_PATH/Info.plist"
          PROFILE=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" | head -1)
          cp "$PROFILE" "$APP_PATH/embedded.mobileprovision"
          CERT=$(security find-identity -v -p codesigning | grep "iPhone Distribution" | head -1 | awk '{print $2}')
          codesign --force --sign "$CERT" --entitlements /dev/null "$APP_PATH"
          cd Payload_dir && zip -r ../app_new.ipa Payload/ && cd ..
          mv app_new.ipa app.ipa
          app-store-connect publish --issuer-id "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" --private-key "@file:$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" --path app.ipa --testflight
