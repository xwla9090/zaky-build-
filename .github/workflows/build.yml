name: Build and Upload to TestFlight
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download IPA
        run: curl -L -o app.ipa "${{ secrets.IPA_URL }}"

      - name: Install tools
        run: pip3 install codemagic-cli-tools --break-system-packages

      - name: Setup API Key
        run: |
          mkdir -p ~/.private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Create cert and profile
        run: |
          openssl genrsa -out cert.key 2048
          
          app-store-connect certificates list \
            --issuer-id "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --private-key "@file:$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" \
            --type IOS_DISTRIBUTION 2>&1 | grep "^Id:" | awk '{print $2}' | while read CID; do
              app-store-connect certificates delete "$CID" \
                --issuer-id "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
                --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
                --private-key "@file:$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" 2>&1 || true
            done
          
          app-store-connect certificates create \
            --issuer-id "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --private-key "@file:$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" \
            --type IOS_DISTRIBUTION \
            --certificate-key "@file:cert.key" 2>&1 | tee cert_output.txt
          
          CERT_ID=$(grep "^Id:" cert_output.txt | head -1 | awk '{print $2}')
          echo "Cert ID: $CERT_ID"
          
          app-store-connect certificates get "$CERT_ID" \
            --issuer-id "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --private-key "@file:$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" \
            --certificate-key "@file:cert.key" \
            --save
          
          P12=$(find ~/Library/Developer/Xcode -name "*.p12" | head -1)
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import "$P12" -k build.keychain -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" build.keychain
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          
          BUNDLE_ID_ID=$(app-store-connect bundle-ids list \
            --issuer-id "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --private-key "@file:$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" 2>&1 | grep -B5 "${{ secrets.BUNDLE_ID }}" | grep "^Id:" | head -1 | awk '{print $2}')
          echo "Bundle ID ID: $BUNDLE_ID_ID"
          
          app-store-connect profiles create \
            --issuer-id "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --private-key "@file:$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" \
            --name "ZakyProfile" \
            --type IOS_APP_STORE \
            --certificate-ids "$CERT_ID" \
            --save \
            "$BUNDLE_ID_ID" 2>&1 | tee profile_output.txt

      - name: Resign IPA
        run: |
          unzip -o app.ipa -d Payload_dir
          APP_PATH=$(find Payload_dir -name "*.app" -maxdepth 3 | head -1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${{ secrets.BUNDLE_ID }}" "$APP_PATH/Info.plist"
          PROFILE=$(find ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles -name "*.mobileprovision" | head -1)
          echo "Profile: $PROFILE"
          cp "$PROFILE" "$APP_PATH/embedded.mobileprovision"
          CERT=$(security find-identity -v -p codesigning build.keychain | grep "iPhone Distribution" | head -1 | awk '{print $2}')
          echo "Cert: $CERT"
          codesign --force --sign "$CERT" "$APP_PATH"
          cd Payload_dir && zip -r ../app_new.ipa Payload/ && cd ..
          mv app_new.ipa app.ipa

      - name: Upload to TestFlight
        run: |
          app-store-connect publish \
            --issuer-id "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --private-key "@file:$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" \
            --path app.ipa \
            --testflight
